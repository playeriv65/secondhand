<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5ef" />
    <meta
      name="description"
      content="我的个人闲置转让清单，价格、照片和交接时间，微信联系即可。"
    />
    <title>闲置转让</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body data-page="now">
    <header class="topbar">
      <a class="brand" href="/" aria-label="首页"
        ><span class="brand-icon">↗</span
        ><span id="brand-title">闲置转让</span></a
      ><button class="contact-button" data-contact>微信联系 ↗</button>
    </header>
    <main>
      <section class="intro" aria-labelledby="headline">
        <div class="intro-copy">
          <h1 id="headline">我的闲置转让</h1>
          <p id="description"></p>
          <p id="pickup" class="pickup"></p>
        </div>
        <button
          id="intro-contact"
          class="intro-contact"
          data-contact
          aria-label="微信联系"
        ></button>
      </section>
      <nav class="pages" aria-label="出售时间">
        <a href="/" data-page-link="now">现在可出</a
        ><a href="/later.html" data-page-link="later"
          >毕业后预计出 <span>↗</span></a
        >
      </nav>
      <p id="later-note" class="later-note" hidden></p>
      <div id="demo-notice" class="demo-notice" hidden></div>
      <section aria-label="我的闲置物品">
        <div id="items" class="grid"></div>
        <p id="empty" class="empty" hidden></p>
      </section>
      <footer>
        <span>个人闲置 · 微信联系 · 交接方式可商量</span
        ><a href="#">回到顶部 ↑</a>
      </footer>
    </main>
    <dialog id="item-dialog">
      <button class="close" data-close aria-label="关闭">×</button>
      <div id="item-detail"></div>
    </dialog>
    <dialog id="contact-dialog" class="contact-dialog">
      <button class="close" data-close aria-label="关闭">×</button>
      <h2>微信联系</h2>
      <div id="qr"></div>
      <p id="wechat-id"></p>
      <p id="wechat-hint"></p>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>请开启 JavaScript 以浏览商品清单。</noscript>
  </body>
</html>
